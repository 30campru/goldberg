<!DOCTYPE html>
<html>
  <head>
    <title>Drop the Ball</title>
        <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
         <script src="https://cdn.jsdelivr.net/npm/@c-frame/aframe-physics-system@4.2.x/dist/aframe-physics-system.min.js"></script> 

  </head>
  <body>
    <a-scene physics="gravity: -20">
    
        <a-sky color="lightblue"></a-sky>

     
     
      <a-entity camera look-controls
      wasd-controls
      position="0 1.6 10"
      constraint="collideConnected:false"
      dynamic-body
      ></a-entity>
    
    
      <a-box static-body
        height="0.000001"
        width="29"
        depth="29" 
       color="tan"
      ></a-box>
      
     <a-box static-body
        position="60 0 0"
        height="0.000001"
        width="2"
        depth="2" 
       color="tan"
      ></a-box>
      
      <a-sphere dynamic-body color="red" radius="1" position="60 2 0"></a-sphere>

    
       <a-box static-body
      position="-10 2 0"
      rotation="30 95 0"
        height="0.000001"
        width="5"
        depth="2" 
       color="tan"
      ></a-box>
      
            <a-box dynamic-body position="4 2 0"
        height="4"
        width="2"
        depth="0.5" 
       color="green"
       rotation="0 90 0"
      ></a-box>      <a-box dynamic-body position="2 2 0"
        height="4"
        width="2"
        depth="0.5" 
       color="green"
       rotation="0 90 0"
      ></a-box>
       
      <a-box dynamic-body position="0 2 0"
        height="4"
        width="2"
        depth="0.5" 
       color="green"
       rotation="0 90 0"
      ></a-box>
      
      <a-cylinder dynamic-body 
      position="9.5 2 0"
      radius="2"
      height="5" 
      color="yellow"
      rotation="90 0 0"
      ></a-cylinder>
      
      
      
       <a-box static-body position="0 0 15" 
      width="31" height="0.5" depth="1" 
      color="black" ></a-box>
      
      <a-box static-body position="0 0 -15" 
      width="31" height="0.5" depth="1" 
      color="black" ></a-box>
      
      <a-box dynamic-body position="15 25.5 0" 
      width=".3" height="50" depth="30" 
      color="black" ></a-box>
      
      <a-box static-body position="-15 0 0" 
      width="1" height="0.5" depth="30" 
      color="black" ></a-box>
      
      <a-box static-body position="15 -0.5 0" 
      width="15" height="0.1" depth="30" 
      color="black" ></a-box>
      
      
    
      
      ></a-box>    
    
      <a-sphere dynamic-body color="red" radius="1" position="-10 10 0"></a-sphere>
  </a-scene>

  </body>
</html>
